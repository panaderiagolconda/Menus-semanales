<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1A110C" />
<title>Golconda · Edición Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Creepster&display=swap" />
<style>
@font-face{ font-family:"Amsi Pro Cond"; src:url("AmsiProCond-Regular.woff2") format("woff2"); font-weight:400; font-display:swap; }
@font-face{ font-family:"Amsi Pro Cond"; src:url("AmsiProCond-Bold.woff2") format("woff2"); font-weight:700; font-display:swap; }

/* Concepto: la vitrina de octubre — cada producto es una pieza de la
   campaña puesta en una mesa oscura, con luz de calabaza. */
:root{
  --noche:   #1A110C;
  --noche-2: #261911;
  --espresso:#4A3524;
  --coral:   #F25238;
  --calabaza:#FF8F3F;
  --vela:    #FFD27A;
  --crema:   #FFF0E2;
  --tenue:   #CBB4A1;
  --linea:   #3D2B1F;
  --verde-wa:#25D366;

  --f-marca:"Amsi Pro Cond","Barlow Condensed",system-ui,sans-serif;
  --f-miedo:"Creepster","Amsi Pro Cond","Barlow Condensed",cursive;
  --ancho:560px;
  color-scheme:dark;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  font-family:var(--f-marca); color:var(--crema);
  background:radial-gradient(ellipse 90% 45% at 85% 0%, rgba(242,82,56,.16), transparent 70%), var(--noche);
  background-attachment:fixed;
  min-height:100vh; line-height:1.45; overflow-x:hidden;
  padding-bottom:110px;
}
a{ color:inherit; }
[hidden]{ display:none !important; }
button{ font-family:inherit; }

/* ===================================================================
   AMBIENTE HALLOWEEN — luna, estrellas, murciélagos, niebla, telaraña
   (Para quitarlo después de Halloween: borra este bloque y el
    <div class="ambiente"> del HTML.)
   =================================================================== */
.ambiente{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.luna{
  position:absolute; top:34px; right:-34px;
  width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle at 36% 34%, #FFF7E8 0%, #F7E0B8 55%, #E3BE86 100%);
  box-shadow:0 0 50px 14px rgba(255,214,150,.16), 0 0 160px 70px rgba(242,82,56,.10);
  opacity:.92;
}
.luna i{ position:absolute; border-radius:50%; background:rgba(190,150,100,.28); }
.luna i:nth-child(1){ width:26px; height:26px; top:40px; left:34px; }
.luna i:nth-child(2){ width:14px; height:14px; top:86px; left:70px; }
.luna i:nth-child(3){ width:18px; height:18px; top:52px; left:88px; }

.estrella{
  position:absolute; width:2px; height:2px; border-radius:50%;
  background:var(--crema); opacity:.25;
  animation:titila var(--d,3s) ease-in-out infinite; animation-delay:var(--r,0s);
}
@keyframes titila{ 50%{ opacity:.95; transform:scale(1.4); } }

.niebla{
  position:absolute; left:-50%; bottom:-30px; width:200%; height:240px;
  background:
    radial-gradient(ellipse 22% 60% at 15% 70%, rgba(255,240,226,.10), transparent 70%),
    radial-gradient(ellipse 18% 50% at 42% 80%, rgba(255,240,226,.08), transparent 70%),
    radial-gradient(ellipse 25% 55% at 70% 75%, rgba(255,240,226,.09), transparent 70%),
    radial-gradient(ellipse 20% 50% at 92% 85%, rgba(255,240,226,.07), transparent 70%);
  animation:niebla 38s ease-in-out infinite alternate;
}
.niebla.dos{ bottom:-70px; opacity:.8; animation-duration:52s; animation-direction:alternate-reverse; }
@keyframes niebla{ from{ transform:translateX(0); } to{ transform:translateX(22%); } }

.murcielago{
  position:absolute; left:0; top:var(--y); width:var(--w,40px);
  color:#0B0705; filter:drop-shadow(0 0 5px rgba(242,82,56,.45));
  animation:vuela var(--t,14s) linear infinite; animation-delay:var(--delay,0s);
  transform:translateX(-90px);
}
.murcielago svg{ display:block; width:100%; height:auto; animation:aletea .22s ease-in-out infinite alternate; }
@keyframes vuela{
  0%  { transform:translate(-90px, 0); }
  25% { transform:translate(25vw, -26px); }
  50% { transform:translate(50vw, 12px); }
  75% { transform:translate(75vw, -18px); }
  100%{ transform:translate(calc(100vw + 90px), 6px); }
}
@keyframes aletea{ from{ transform:scaleY(1); } to{ transform:scaleY(.3); } }

.telarana{ position:absolute; top:0; left:0; width:170px; height:170px; opacity:.35; }
.arana{
  position:absolute; left:118px; top:0; width:2px;
  animation:baja 6s ease-in-out infinite;
}
.arana .hilo{ width:1px; height:110px; background:rgba(255,240,226,.45); margin:0 auto; }
.arana svg{ display:block; width:26px; margin-left:-12px; }
@keyframes baja{ 0%,100%{ transform:translateY(-40px); } 50%{ transform:translateY(0); } }

.fantasma-vuela{
  position:absolute; top:52%; left:-80px; width:56px; pointer-events:auto; cursor:pointer;
  opacity:.0; animation:flota 26s ease-in-out infinite; animation-delay:4s;
}
.fantasma-vuela svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 0 14px rgba(255,240,226,.35)); }
@keyframes flota{
  0%  { transform:translate(0,0) rotate(-4deg); opacity:0; }
  8%  { opacity:.85; }
  30% { transform:translate(35vw,-40px) rotate(5deg); }
  55% { transform:translate(65vw,20px) rotate(-4deg); opacity:.85; }
  70% { opacity:0; transform:translate(85vw,-10px); }
  100%{ opacity:0; transform:translate(85vw,-10px); }
}
.buu{
  position:fixed; z-index:90; pointer-events:none;
  font-family:var(--f-miedo); font-size:42px; color:var(--crema);
  text-shadow:0 0 18px var(--coral);
  animation:buu 1s ease-out forwards;
}
@keyframes buu{ from{ opacity:1; transform:translate(-50%,-50%) scale(.6); } to{ opacity:0; transform:translate(-50%,-140%) scale(1.4); } }

@media (prefers-reduced-motion: reduce){
  .murcielago, .fantasma-vuela{ display:none; }
}


.pagina{
  position:relative; z-index:1; max-width:var(--ancho); margin:0 auto;
  padding:18px 18px 20px; display:flex; flex-direction:column; gap:40px;
}

/* Barra superior */
.barra{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.volver{
  text-decoration:none; font-size:14px; font-weight:700; letter-spacing:.4px;
  border:1px solid rgba(255,240,226,.3); border-radius:999px; padding:6px 14px; color:var(--tenue);
}
.volver:hover{ color:var(--crema); border-color:var(--crema); }
.logo{ height:38px; width:auto; display:block; }
.logo-texto{ font-weight:800; font-size:26px; display:none; }

/* ===================================================================
   HÉROE — ¿Dulce o truco?
   =================================================================== */
.heroe{ text-align:center; padding-top:34px; }
.heroe .edicion{ font-size:13px; font-weight:700; letter-spacing:2.6px; text-transform:uppercase; color:var(--coral); }
.heroe h1{
  font-family:var(--f-miedo); font-weight:400;
  font-size:clamp(56px,17vw,88px); line-height:.9; letter-spacing:2px; margin-top:8px;
  color:var(--crema); text-shadow:0 0 30px rgba(242,82,56,.45);
}
.heroe p{ margin-top:12px; font-size:18px; color:var(--tenue); }
.eleccion{ display:flex; justify-content:center; gap:12px; margin-top:22px; }
.eleccion button{
  cursor:pointer; border:none; border-radius:16px; padding:13px 26px 12px;
  font-weight:800; font-size:20px; letter-spacing:1px; text-transform:uppercase;
  transition:transform .12s ease;
}
.eleccion button:active{ transform:scale(.96); }
.b-dulce{ background:var(--coral); color:var(--crema); box-shadow:0 8px 24px rgba(242,82,56,.45); }
.b-truco{ background:transparent; color:var(--tenue); border:1.5px solid var(--linea) !important; }
.b-truco:hover{ color:var(--crema); border-color:var(--tenue) !important; }

/* Susto (botón Truco) */
.susto{
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(10,6,4,.92);
}
.susto svg{ width:min(60vw,260px); animation:asusta .9s cubic-bezier(.2,1.6,.4,1) both; filter:drop-shadow(0 0 40px rgba(255,240,226,.5)); }
.susto p{ font-family:var(--f-miedo); font-size:54px; margin-top:12px; color:var(--crema); animation:asusta .9s .1s cubic-bezier(.2,1.6,.4,1) both; }
.susto small{ font-size:18px; color:var(--tenue); margin-top:6px; }
@keyframes asusta{ from{ transform:scale(.2) translateY(120px); opacity:0; } to{ transform:none; opacity:1; } }

/* Confeti de dulces (botón Dulce) */
.dulce{
  position:fixed; z-index:100; width:14px; height:9px; border-radius:5px; pointer-events:none;
  animation:estalla 1s ease-out forwards;
}
@keyframes estalla{
  from{ transform:translate(-50%,-50%) rotate(0); opacity:1; }
  to  { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity:0; }
}

/* ===================================================================
   PRODUCTOS
   =================================================================== */
.productos{ display:flex; flex-direction:column; gap:26px; scroll-margin-top:20px; }
.producto{
  position:relative; background:var(--noche-2); border:1px solid var(--linea);
  border-radius:26px; overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.producto .media{ position:relative; background:var(--coral); }
.producto.kit .media{ background:var(--espresso); }
.producto .media img{ display:block; width:100%; height:auto; }
.producto.caja .media{ padding:26px 0 10px; display:flex; justify-content:center; }
.producto.caja .media img{
  width:74%; aspect-ratio:1; object-fit:cover; border-radius:50%;
  border:6px solid var(--crema); box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.sello{
  position:absolute; top:18px; left:18px;
  background:var(--noche); color:var(--crema);
  font-weight:800; font-size:16px; letter-spacing:1px; text-transform:uppercase;
  padding:6px 14px; border-radius:10px; transform:rotate(-4deg);
}
.producto.kit .sello{ background:var(--crema); color:var(--espresso); }
.precio-burbuja{
  position:absolute; right:16px; bottom:-30px; z-index:2;
  width:96px; height:96px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:var(--noche); color:var(--crema); border:4px solid var(--crema);
  font-weight:800; font-size:22px; line-height:1; font-variant-numeric:tabular-nums;
  transform:rotate(-8deg);
}
.producto.kit .precio-burbuja{ background:var(--coral); border-color:var(--noche-2); }
.cuerpo{ padding:24px 20px 20px; display:flex; flex-direction:column; gap:12px; }
.cuerpo .eyebrow{ font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--coral); }
.cuerpo h2{ font-weight:800; font-size:32px; line-height:.98; text-transform:uppercase; text-wrap:balance; }
.cuerpo .eyebrow{ padding-right:100px; }
.cuerpo p{ font-size:17px; color:var(--tenue); max-width:46ch; }
.incluye{ list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.incluye li{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0;
  font-weight:700; font-size:15px; line-height:1.1;
}
.incluye svg{ width:34px; height:34px; }
.etiquetas{ display:flex; flex-wrap:wrap; gap:8px; }
.etiquetas span{ font-size:14px; font-weight:600; padding:5px 12px; border-radius:999px; background:rgba(255,240,226,.08); color:var(--crema); }

/* Selector de cantidad */
.agregar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border-top:1px dashed var(--linea); padding-top:14px; margin-top:4px;
}
.agregar label{ font-size:15px; font-weight:700; color:var(--tenue); }
.paso{ display:flex; align-items:center; gap:4px; background:var(--noche); border:1px solid var(--linea); border-radius:14px; padding:4px; }
.paso button{
  width:40px; height:40px; border:none; border-radius:10px; cursor:pointer;
  background:transparent; color:var(--crema); font-size:24px; font-weight:700; line-height:1;
}
.paso button:hover{ background:rgba(255,240,226,.08); }
.paso button.mas{ background:var(--coral); }
.paso output{ min-width:34px; text-align:center; font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; }

/* ===================================================================
   ARMA TU PEDIDO
   =================================================================== */
.pedido{
  background:var(--crema); color:var(--noche);
  border-radius:26px; padding:24px 20px 22px; display:flex; flex-direction:column; gap:16px;
  scroll-margin-top:20px;
}
.pedido h2{ font-weight:800; font-size:30px; text-transform:uppercase; line-height:1; }
.grupo{ display:flex; flex-direction:column; gap:8px; }
.grupo > span{ font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--espresso); }
.segmento{ display:flex; gap:6px; background:#F1DCCB; padding:5px; border-radius:14px; }
.segmento button{
  flex:1; border:none; background:transparent; cursor:pointer; color:var(--espresso);
  font-weight:700; font-size:16px; padding:10px 6px; border-radius:10px;
}
.segmento button[aria-pressed="true"]{ background:var(--noche); color:var(--crema); }
.nota{ font-size:14px; color:#7A5B41; }
.resumen{ display:flex; flex-direction:column; border-top:2px solid var(--noche); padding-top:6px; }
.resumen .linea{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:16px; font-weight:600; border-bottom:1px dashed #E2C7B2; }
.resumen .linea b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.resumen .vacio{ padding:8px 0; color:#7A5B41; font-size:15px; }
.resumen .total{ display:flex; justify-content:space-between; padding-top:10px; font-weight:800; font-size:24px; }
.resumen .total b{ color:var(--coral); font-variant-numeric:tabular-nums; }

/* Piezas para compartir */
.piezas h2{ font-weight:800; font-size:26px; text-transform:uppercase; }
.piezas p{ color:var(--tenue); font-size:16px; margin-top:2px; }
.piezas .fila{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.piezas button{
  border:none; padding:0; background:none; cursor:zoom-in; border-radius:14px; overflow:hidden;
  transition:transform .15s ease;
}
.piezas button:hover{ transform:translateY(-3px) rotate(-1deg); }
.piezas img{ display:block; width:100%; height:auto; }
.visor{
  position:fixed; inset:0; z-index:110; background:rgba(10,6,4,.94);
  display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out;
}
.visor img{ max-width:100%; max-height:100%; border-radius:12px; }

/* Pie */
.pie{ text-align:center; color:var(--tenue); font-size:15px; display:flex; flex-direction:column; gap:10px; }
.pie .pt b{ display:block; color:var(--crema); font-size:18px; }
.pie .pt span{ font-variant-numeric:tabular-nums; }

/* Barra flotante de WhatsApp */
.flotante{
  position:fixed; left:50%; transform:translateX(-50%); z-index:50;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 32px); max-width:calc(var(--ancho) - 32px);
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--verde-wa); color:#fff; text-decoration:none;
  font-weight:800; font-size:18px; letter-spacing:.3px;
  padding:14px 18px; border-radius:16px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.flotante .cant{
  background:#fff; color:#128C7E; border-radius:999px; min-width:26px; height:26px; padding:0 7px;
  display:inline-flex; align-items:center; justify-content:center; font-size:15px;
}

:focus-visible{ outline:3px solid var(--vela); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } html{ scroll-behavior:auto; } }
@media (max-width:380px){
  .cuerpo h2{ font-size:27px; }
  .precio-burbuja{ width:84px; height:84px; font-size:19px; }
}
</style>
</head>

<!-- AMBIENTE HALLOWEEN (decorativo) -->
<div class="ambiente" aria-hidden="true">
  <div class="luna"><i></i><i></i><i></i></div>
  <div id="cielo"></div>
  <svg class="telarana" id="telarana" viewBox="0 0 170 170"></svg>
  <div class="arana">
    <div class="hilo"></div>
    <svg viewBox="0 0 26 22"><g stroke="#0B0705" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M9 9 L2 4 M9 11 L1 11 M9 13 L2 18 M10 15 L5 21"/><path d="M17 9 L24 4 M17 11 L25 11 M17 13 L24 18 M16 15 L21 21"/></g>

  </div>
  <div class="niebla"></div>
  <div class="niebla dos"></div>

      <ellipse cx="22" cy="30" rx="4" ry="6" fill="#1A110C"/><ellipse cx="38" cy="30" rx="4" ry="6" fill="#1A110C"/>
      <ellipse cx="30" cy="44" rx="4" ry="5" fill="#1A110C"/></svg>
  </div>
</div>


<div class="pagina">

  <div class="barra">
    <a class="volver" href="index.html">↩ Inicio</a>
    <img class="logo" src="logo-halloween.png" alt="Golconda"
         onerror="this.style.display='none';document.getElementById('logoTexto').style.display='block';" />
    <div class="logo-texto" id="logoTexto">Golconda</div>
  </div>

  <header class="heroe">
    <div class="edicion">Edición Halloween</div>
    <h1>¿Dulce o truco?</h1>
    <p>Galletas hechas en casa para la noche más dulce del año.</p>
    <div class="eleccion">
      <button type="button" class="b-dulce" id="bDulce">Dulce</button>
      <button type="button" class="b-truco" id="bTruco">Truco</button>

  <section class="productos" id="productos" aria-label="Productos de temporada"></section>

  <section class="pedido" id="pedido" aria-labelledby="tPedido">

    <div class="grupo">
      <span>Punto de venta</span>

      <div class="segmento" id="selEntrega" role="group" aria-label="Entrega"></div>
      <div class="nota" id="notaEntrega"></div>

    <div class="fila">
      <button type="button" data-img="halloween-pieza-caja.jpg"><img src="halloween-pieza-caja.jpg" alt="Pieza: Caja de galletas de Halloween ×12, $25.000" loading="lazy" /></button>
      <button type="button" data-img="halloween-pieza-kit.jpg"><img src="halloween-pieza-kit.jpg" alt="Pieza: Kit para decorar galletas, $42.000" loading="lazy" /></button>
    </div>
  </section>

  <footer class="pie" id="pie"></footer>
</div>

  </svg>
  <span id="waTexto">Pedir por WhatsApp</span>
</a>

<div class="susto" id="susto" hidden>
  <svg viewBox="0 0 60 70" aria-hidden="true"><path d="M6 66V30a24 24 0 0 1 48 0v36l-8-7-8 7-8-7-8 7-8-7z" fill="#FFF0E2"/>
    <ellipse cx="22" cy="30" rx="4" ry="6" fill="#1A110C"/><ellipse cx="38" cy="30" rx="4" ry="6" fill="#1A110C"/>
    <ellipse cx="30" cy="46" rx="6" ry="8" fill="#1A110C"/></svg>
  <p>¡Buuu!</p>
  <small>Mejor elige dulce…</small>
</div>

<div class="visor" id="visor" hidden><img id="visorImg" alt="" /></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ▼▼▼  ZONA EDITABLE  ▼▼▼
   ═══════════════════════════════════════════════════════════════════ */

/* Productos de temporada. Cambia nombres, precios o textos aquí. */
const PRODUCTOS = [
  {
    id: "caja",
    nombre: "Caja de galletas de Halloween ×12",
    corto: "Caja de galletas ×12",
    precio: 25000,
    sello: "×12 galletas",
    eyebrow: "Caja de regalo",
    titulo: "Galletas de Halloween",
    texto: "Doce galletas decoradas a mano: gatos negros, calabazas, fantasmas y sombreros de bruja. Lista para regalar o para el dulce o truco.",
    etiquetas: ["Decoradas a mano", "Lista para regalar"],
    foto: "halloween-caja.jpg",
    alt: "Caja con galletas decoradas de gato negro, calabaza, fantasma y sombrero de bruja"
  },
  {
    id: "kit",
    nombre: "Kit para decorar galletas de Halloween",
    corto: "Kit para decorar",
    precio: 42000,
    sello: "¡Plan en familia!",
    eyebrow: "Kit para decorar",
    titulo: "Esta noche, los monstruos los decoras tú",
    texto: "Todo lo necesario para una tarde de decoración en casa.",
    incluye: ["Galletas listas para decorar", "Glaseado en 4 colores", "Chispitas de colores"],
    foto: "halloween-kit.jpg",
    alt: "Galletas de calabaza y bruja sin decorar, manga con glaseado naranja y chispitas"
  }
];

/* Puntos de venta (mismos datos que menu.html). */
const PUNTOS = {
  santaana: { nombre: "Santa Ana 109", direccion: "Cl. 109 # 6-55",  telefonos: ["601 519 6661", "601 805 3232"] },
  lisboa:   { nombre: "Lisboa 134",    direccion: "Cl. 134 # 9A-88", telefonos: ["601 615 1571", "601 805 1213"] }
};
const WHATSAPP = "573106516929";   // sin "+" ni espacios
const DOMICILIO = 3500;            // valor del envío a domicilio (recoger en el punto no tiene cargo)

/* ═══════════════════════════════════════════════════════════════════
   ▲▲▲  FIN DE LA ZONA EDITABLE  ▲▲▲
   ═══════════════════════════════════════════════════════════════════ */

/* ---- Ambiente Halloween: estrellas, murciélagos, telaraña, fantasma ---- */
(function(){
  const cielo = document.getElementById("cielo");
  if(!cielo) return;
  const quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Estrellas
  for(let i=0;i<55;i++){
    const e = document.createElement("span");
    e.className = "estrella";
    e.style.left = (Math.random()*100) + "%";
    e.style.top  = (Math.random()*60) + "%";
    e.style.setProperty("--d", (2 + Math.random()*4).toFixed(1) + "s");
    e.style.setProperty("--r", (Math.random()*4).toFixed(1) + "s");
    cielo.appendChild(e);
  }

  // Murciélagos
  const BAT = '<svg viewBox="0 0 64 30"><path fill="currentColor" d="M32 9c-1.6-3.4-3.4-4.6-4.6-4.8.9 1.6 1 2.8.3 3.9C24 5.4 17.6 3.6 9.5 4.8c3 1.6 4.4 3.6 4.4 6.6-3.2-1.2-6.8-.9-10.4 1.2 5.2.9 9.4 3.8 11.6 8.2 2.2-1.9 5.2-2.6 8-1.6 2-2.3 4.6-3.4 7-3.4h3.8c2.4 0 5 1.1 7 3.4 2.8-1 5.8-.3 8 1.6 2.2-4.4 6.4-7.3 11.6-8.2-3.6-2.1-7.2-2.4-10.4-1.2 0-3 1.4-5 4.4-6.6-8.1-1.2-14.5.6-18.2 3.3-.7-1.1-.6-2.3.3-3.9C35.4 4.4 33.6 5.6 32 9z"/></svg>';
  if(!quieto){
    [
      { y:"9%",  w:"42px", t:"15s", delay:"0s"  },
      { y:"17%", w:"28px", t:"19s", delay:"3s"  },
      { y:"6%",  w:"22px", t:"23s", delay:"8s"  },
      { y:"30%", w:"34px", t:"17s", delay:"11s" }
    ].forEach(b => {
      const m = document.createElement("div");
      m.className = "murcielago";
      m.style.setProperty("--y", b.y); m.style.setProperty("--w", b.w);
      m.style.setProperty("--t", b.t); m.style.setProperty("--delay", b.delay);
      m.innerHTML = BAT;
      cielo.appendChild(m);
    });
  }

  // Telaraña (esquina superior izquierda)
  const web = document.getElementById("telarana");
  if(web){
    const NS = "http://www.w3.org/2000/svg";
    const rayos = 6, anillos = 6, R = 165;
    const ang = i => (i/(rayos-1)) * Math.PI/2;
    let d = "";
    for(let i=0;i<rayos;i++){
      d += `M0 0 L${(Math.cos(ang(i))*R).toFixed(1)} ${(Math.sin(ang(i))*R).toFixed(1)} `;
    }
    for(let k=1;k<=anillos;k++){
      const r = R * k/anillos;
      for(let i=0;i<rayos-1;i++){
        const a1 = ang(i), a2 = ang(i+1), am = (a1+a2)/2, rs = r*0.86;
        const x1=Math.cos(a1)*r, y1=Math.sin(a1)*r, x2=Math.cos(a2)*r, y2=Math.sin(a2)*r;
        const cx=Math.cos(am)*rs, cy=Math.sin(am)*rs;
        d += `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)} `;
      }
    }
    const p = document.createElementNS(NS,"path");
    p.setAttribute("d", d); p.setAttribute("fill","none");
    p.setAttribute("stroke","#FFF0E2"); p.setAttribute("stroke-width","0.8");
    web.appendChild(p);
  }

  // Fantasma: si lo tocas, dice ¡Buu!
  const f = document.getElementById("fantasmaVuela");
  if(f){
    f.addEventListener("click", ev => {
      const b = document.createElement("div");
      b.className = "buu"; b.textContent = "¡Buu!";
      b.style.left = ev.clientX + "px"; b.style.top = ev.clientY + "px";
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1100);
    });
  }
})();


const pesos = n => "$" + n.toLocaleString("es-CO");
const cantidades = Object.fromEntries(PRODUCTOS.map(p => [p.id, 0]));
let punto = "santaana";
let entrega = "recoger";

const ICONOS = [
  '<svg viewBox="0 0 34 34" fill="none" stroke="#F25238" stroke-width="2.4"><circle cx="17" cy="17" r="14"/><circle cx="12" cy="13" r="2" fill="#F25238"/><circle cx="21" cy="12" r="2" fill="#F25238"/><circle cx="13" cy="21" r="2" fill="#F25238"/><circle cx="21" cy="21" r="2" fill="#F25238"/></svg>',
  '<svg viewBox="0 0 34 34" fill="none" stroke="#F25238" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l10 4 12 18-4 2-14-14z"/><path d="M24 28l4 4"/></svg>',
  '<svg viewBox="0 0 34 34" fill="none" stroke="#F25238" stroke-width="2.4" stroke-linejoin="round"><path d="M5 17h24l-3 11H8z"/><circle cx="11" cy="11" r="2.4" fill="#F25238"/><circle cx="17" cy="8" r="2.4" fill="#F25238"/><circle cx="23" cy="11" r="2.4" fill="#F25238"/></svg>'
];

/* ---- Tarjetas de producto ---- */
function pintarProductos(){
  document.getElementById("productos").innerHTML = PRODUCTOS.map(p => `
    <article class="producto ${p.id}">
      <div class="media">
        <img src="${p.foto}" alt="${p.alt}" />
        <span class="sello">${p.sello}</span>
        <div class="precio-burbuja">${pesos(p.precio)}</div>
      </div>
      <div class="cuerpo">
        <div class="eyebrow">${p.eyebrow}</div>
        <h2>${p.titulo}</h2>
        <p>${p.texto}</p>
        ${p.incluye ? `<ul class="incluye">${p.incluye.map((t,i) => `<li>${ICONOS[i % ICONOS.length]}<span>${t}</span></li>`).join("")}</ul>` : ""}
        ${p.etiquetas ? `<div class="etiquetas">${p.etiquetas.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
        <div class="agregar">
          <label id="lbl-${p.id}">¿Cuántas quieres?</label>
          <div class="paso" role="group" aria-labelledby="lbl-${p.id}">
            <button type="button" data-id="${p.id}" data-d="-1" aria-label="Quitar una">−</button>
            <output id="cant-${p.id}">0</output>
            <button type="button" class="mas" data-id="${p.id}" data-d="1" aria-label="Agregar una">+</button>
          </div>
        </div>
      </div>
    </article>`).join("");

  document.querySelectorAll(".paso button").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    cantidades[id] = Math.max(0, Math.min(20, cantidades[id] + parseInt(b.dataset.d,10)));
    document.getElementById("cant-" + id).textContent = cantidades[id];
    actualizarPedido();
  }));
}

/* ---- Selectores de punto y entrega ---- */
function segmento(contenedor, opciones, actual, alCambiar){
  const el = document.getElementById(contenedor);
  el.innerHTML = opciones.map(o => `<button type="button" data-v="${o.v}" aria-pressed="${o.v===actual}">${o.t}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    alCambiar(b.dataset.v);
  }));
}

/* ---- Resumen y mensaje de WhatsApp ---- */
function actualizarPedido(){
  const items = PRODUCTOS.filter(p => cantidades[p.id] > 0);
  const subtotal = items.reduce((s,p) => s + p.precio * cantidades[p.id], 0);
  const envio = (entrega === "domicilio" && items.length) ? DOMICILIO : 0;
  const total = subtotal + envio;
  const unidades = items.reduce((s,p) => s + cantidades[p.id], 0);
  const P = PUNTOS[punto];

  document.getElementById("resumen").innerHTML = items.length
    ? items.map(p => `<div class="linea"><span>${cantidades[p.id]} × ${p.corto}</span><b>${pesos(p.precio*cantidades[p.id])}</b></div>`).join("")
      + (envio ? `<div class="linea"><span>Domicilio</span><b>${pesos(envio)}</b></div>` : "")
      + `<div class="total"><span>Total</span><b>${pesos(total)}</b></div>`
    : `<div class="vacio">Aún no has agregado productos. Usa el botón + en cada uno.</div>`;

  document.getElementById("notaEntrega").textContent = entrega === "domicilio"
    ? `El domicilio tiene un valor de ${pesos(DOMICILIO)}, que se suma al total.`
    : `Recoges en ${P.nombre} · ${P.direccion}`;

  let msj;
  if(items.length){
    msj = `¡Hola Golconda! 🎃 Quiero hacer un pedido de la Edición Halloween:\n`
        + items.map(p => `• ${cantidades[p.id]} × ${p.nombre} — ${pesos(p.precio*cantidades[p.id])}`).join("\n")
        + (envio ? `\nDomicilio: ${pesos(envio)}` : "")
        + `\nTotal: ${pesos(total)}\nPunto: ${P.nombre}\nEntrega: ${entrega === "domicilio" ? "A domicilio" : "Recoger en el punto"}`
        + `\n¿Me confirman disponibilidad?`;
  } else {
    msj = `¡Hola Golconda! 🎃 Quiero información sobre los productos de Halloween (caja de galletas y kit para decorar) en ${P.nombre}.`;
  }
  document.getElementById("btnWa").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msj)}`;
  document.getElementById("waTexto").innerHTML = items.length
    ? `Pedir por WhatsApp <span class="cant">${unidades}</span> · ${pesos(total)}`
    : "Pedir por WhatsApp";
}

/* ---- Pie con puntos de venta ---- */
function pintarPie(){
  document.getElementById("pie").innerHTML =
    Object.values(PUNTOS).map(p => `<div class="pt"><b>${p.nombre}</b>${p.direccion}<br><span>${p.telefonos.join(" · ")}</span></div>`).join("")
    + `<div class="pt"><b>WhatsApp</b><span>310 651 6929</span></div>`;
}

/* ---- ¿Dulce o truco? ---- */
const irAProductos = () => document.getElementById("productos").scrollIntoView({ behavior:"smooth", block:"start" });
const quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

document.getElementById("bDulce").addEventListener("click", ev => {
  if(!quieto){
    const r = ev.currentTarget.getBoundingClientRect();
    const colores = ["#F25238","#FF8F3F","#FFD27A","#FFF0E2","#7B4BA0","#3B5D2A"];
    for(let i=0;i<26;i++){
      const d = document.createElement("span");
      d.className = "dulce";
      const a = Math.random()*Math.PI*2, dist = 70 + Math.random()*110;
      d.style.left = (r.left + r.width/2) + "px"; d.style.top = (r.top + r.height/2) + "px";
      d.style.background = colores[i % colores.length];
      d.style.setProperty("--dx", Math.cos(a)*dist + "px");
      d.style.setProperty("--dy", Math.sin(a)*dist + "px");
      d.style.setProperty("--rot", (Math.random()*720-360) + "deg");
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1050);
    }
  }
  setTimeout(irAProductos, quieto ? 0 : 450);
});

document.getElementById("bTruco").addEventListener("click", () => {
  const s = document.getElementById("susto");
  s.hidden = false;
  setTimeout(() => { s.hidden = true; irAProductos(); }, 1500);
});
document.getElementById("susto").addEventListener("click", e => { e.currentTarget.hidden = true; irAProductos(); });

/* ---- Visor de piezas ---- */
const visor = document.getElementById("visor");
document.querySelectorAll(".piezas button").forEach(b => b.addEventListener("click", () => {
  document.getElementById("visorImg").src = b.dataset.img;
  visor.hidden = false;
}));
visor.addEventListener("click", () => visor.hidden = true);
document.addEventListener("keydown", e => { if(e.key === "Escape") visor.hidden = true; });

/* ---- Arranque ---- */
pintarProductos();
segmento("selPunto", [{v:"santaana",t:"Santa Ana 109"},{v:"lisboa",t:"Lisboa 134"}], punto, v => { punto = v; actualizarPedido(); });
segmento("selEntrega", [{v:"recoger",t:"Recoger en el punto"},{v:"domicilio",t:"A domicilio"}], entrega, v => { entrega = v; actualizarPedido(); });
pintarPie();
actualizarPedido();
</script>
</body>
</html>
