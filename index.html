<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F25238" />
<title>Golconda · Elige tu punto</title>

<style>
@font-face{
  font-family:"Amsi Pro Cond";
  src:url("AmsiProCond-Regular.woff2") format("woff2");
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Amsi Pro Cond";
  src:url("AmsiProCond-Bold.woff2") format("woff2");
  font-weight:700; font-style:normal; font-display:swap;
}
:root{
  --masa:#FEEBDC; --miga:#FFF7F0; --espresso:#4A3524; --cafe:#7A5B41;
  --miel:#F25238; --miel-sv:#FBD9CF; --linea:#F3DECE;
  --sombra:0 1px 2px rgba(33,28,25,.04), 0 10px 26px rgba(242,82,56,.08);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:"Amsi Pro Cond", system-ui, sans-serif;
  background:var(--masa); color:var(--espresso);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px;
}
.wrap{ width:100%; max-width:460px; text-align:center; }
.logo-img{ max-height:88px; width:auto; max-width:80%; display:block; margin:0 auto 6px; }
.marca-fallback{
  font-family:"Amsi Pro Cond", sans-serif; font-weight:700; font-size:40px;
  color:var(--miel); display:none;
}
.lema-inicio{
  margin-top:10px;
  font-size:17px; font-weight:700;
  color:var(--miel);
  letter-spacing:2px; text-transform:uppercase;
}
.titulo{
  margin-top:26px;
  font-family:"Amsi Pro Cond", sans-serif; font-weight:700;
  font-size:26px; line-height:1.15;
}
.subtitulo{
  margin-top:6px; margin-bottom:26px;
  font-size:15px; color:var(--cafe); font-weight:600;
  letter-spacing:.5px; text-transform:uppercase;
}
.puntos{ display:flex; flex-direction:column; gap:14px; }
.punto-card{
  display:flex; align-items:center; gap:14px;
  background:var(--miga); border:1px solid var(--linea);
  border-radius:18px; padding:20px 20px;
  text-decoration:none; color:var(--espresso);
  box-shadow:var(--sombra);
  transition:transform .12s ease, border-color .2s ease;
}
.punto-card:hover{ transform:translateY(-2px); border-color:var(--miel); }
.punto-card:active{ transform:translateY(0); }
.punto-info{ flex:1; text-align:left; }
.punto-nombre{
  font-family:"Amsi Pro Cond", sans-serif; font-weight:700;
  font-size:24px; color:var(--miel); line-height:1.1;
}
.punto-dir{ font-size:14px; color:var(--cafe); margin-top:3px; }
.flecha{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  background:var(--miel); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:700;
}
.pie{
  margin-top:28px; font-size:13px; color:var(--cafe);
}
:focus-visible{ outline:3px solid var(--miel); outline-offset:3px; border-radius:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="Golconda" class="logo-img" id="logoImg"
         onerror="this.style.display='none';document.getElementById('marcaFallback').style.display='block';" />
    <div class="marca-fallback" id="marcaFallback">Golconda</div>

    <div class="lema-inicio">Menú del día</div>

    <div class="titulo">¿Dónde quieres pedir hoy?</div>
    <div class="subtitulo">Elige tu punto de venta</div>

    <div class="puntos">
      <a class="punto-card" href="menu.html?p=santaana">
        <div class="punto-info">
          <div class="punto-nombre">Santa Ana 109</div>
          <div class="punto-dir">Cl. 109 # 6-55</div>
        </div>
        <div class="flecha" aria-hidden="true">&rsaquo;</div>
      </a>

      <a class="punto-card" href="menu.html?p=lisboa">
        <div class="punto-info">
          <div class="punto-nombre">Lisboa 134</div>
          <div class="punto-dir">Cl. 134 # 9A-88</div>
        </div>
        <div class="flecha" aria-hidden="true">&rsaquo;</div>
      </a>
    </div>

    <div class="pie">Panader&iacute;a &amp; Pasteler&iacute;a · Men&uacute; del d&iacute;a</div>
  </div>
</body>
</html>
