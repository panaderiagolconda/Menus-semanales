<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F25238" />
<title>Golconda · Menú del día</title>

<!-- Lector de Excel (SheetJS) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
/* ===================================================================
   TIPOGRAFÍA DE LA MARCA — Amsi Pro Condensed (incrustada)
   =================================================================== */
@font-face{
  font-family:"Amsi Pro Cond";
  src:url("AmsiProCond-Regular.woff2") format("woff2");
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Amsi Pro Cond";
  src:url("AmsiProCond-Bold.woff2") format("woff2");
  font-weight:700; font-style:normal; font-display:swap;
}

/* ===================================================================
   PALETA — cocina, café y masa recién horneada
   =================================================================== */
:root{
  --masa:     #FEEBDC;  /* fondo durazno de la marca   */
  --miga:     #FFF7F0;  /* tarjetas, crema clara        */
  --espresso: #4A3524;  /* café oscuro (antes negro)    */
  --cafe:     #7A5B41;  /* café medio, texto secundario */
  --miel:     #F25238;  /* acento CORAL de la marca     */
  --miel-sv:  #FBD9CF;  /* coral muy suave              */
  --linea:    #F3DECE;  /* divisorias durazno           */
  --verde-wa: #25D366;  /* verde WhatsApp               */
  --verde-wa-2:#128C7E;

  --sombra: 0 1px 2px rgba(33,28,25,.04), 0 10px 26px rgba(242,82,56,.07);
  --radio: 16px;
  --ancho: 540px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:"Amsi Pro Cond", system-ui, sans-serif;
  color:var(--espresso);
  background:var(--masa);
  line-height:1.5;
  padding-bottom:120px; /* espacio para el botón flotante */
  min-height:100vh;
}
.contenedor{ max-width:var(--ancho); margin:0 auto; }

/* ===================================================================
   ENCABEZADO
   =================================================================== */
.cabecera{
  background:var(--masa);
  color:var(--espresso);
  padding:20px 22px 18px;
  border-bottom:3px solid var(--miel);
  text-align:center;
}
.marca-wrap{ display:flex; align-items:center; justify-content:center; }
.logo-img{
  max-height:66px; width:auto; max-width:82%;
  display:block;
}
.marca{
  font-family:"Amsi Pro Cond", sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:.5px;
  line-height:1;
  color:var(--miel);
}
.marca span{ color:var(--espresso); }
.lema{
  margin-top:10px;
  font-size:17px;
  color:var(--cafe);
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.punto{
  margin-top:12px;
  font-family:"Amsi Pro Cond", sans-serif;
  font-weight:700;
  font-size:24px;
  color:var(--miel);
  line-height:1.05;
}
.cambiar{
  display:inline-block;
  margin-top:12px;
  font-size:13px; font-weight:600;
  color:var(--cafe); text-decoration:none;
  border:1px solid var(--linea);
  padding:6px 14px; border-radius:999px;
  background:var(--miga);
}
.cambiar:hover{ border-color:var(--miel); color:var(--miel); }
.pie-punto{ font-weight:700; color:var(--espresso); font-size:15px; margin-bottom:6px; }

/* ===================================================================
   PESTAÑAS DE DÍAS (scroll horizontal)
   =================================================================== */
.dias{
  position:sticky; top:0; z-index:20;
  background:var(--masa);
  border-bottom:1px solid var(--linea);
  padding:12px 0;
}
.dias-track{
  display:flex; gap:8px;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}
.dias-track::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto;
  scroll-snap-align:center;
  min-width:60px;
  border:1px solid var(--linea);
  background:var(--miga);
  color:var(--cafe);
  border-radius:12px;
  padding:8px 6px 7px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  transition:transform .12s ease, background .2s ease, border-color .2s ease, color .2s ease;
}
.chip:hover{ border-color:var(--miel); }
.chip .dia-abrev{ font-weight:700; font-size:14px; display:block; }
.chip .dia-fecha{ font-size:11px; opacity:.6; margin-top:1px; display:block; }
.chip.activo{
  background:var(--espresso);
  border-color:var(--espresso);
  color:var(--miga);
  transform:translateY(-1px);
}
.chip.hoy::after{
  content:"HOY";
  display:block;
  font-size:9px; font-weight:700; letter-spacing:1px;
  color:var(--miel);
  margin-top:2px;
}
.chip.activo.hoy::after{ color:var(--miel-sv); }

/* ===================================================================
   CONTENIDO DEL DÍA
   =================================================================== */
.dia-panel{ padding:20px 16px 8px; }

.dia-cabecera{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  margin-bottom:4px;
}
.dia-nombre{
  font-family:"Amsi Pro Cond", sans-serif;
  font-weight:700;
  font-size:30px;
  line-height:1.05;
  text-transform:capitalize;
}
.dia-fecha-grande{ color:var(--cafe); font-weight:600; font-size:15px; }
.etiqueta-festivo{
  display:inline-block;
  background:var(--miel);
  color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.5px;
  padding:3px 9px; border-radius:999px;
  text-transform:uppercase;
}
.incluye{
  margin:18px 0 0;
  font-size:14px; color:var(--cafe); font-weight:700;
  display:inline-flex; align-items:center; gap:7px;
  background:var(--miel-sv);
  padding:7px 14px; border-radius:999px;
}

/* Selector Opción 1 / Opción 2 (solo días con varias opciones) */
.opciones-sel{
  display:flex; gap:6px; margin-bottom:16px;
  background:var(--miga); padding:5px; border-radius:12px;
  border:1px solid var(--linea);
}
.opciones-sel button{
  flex:1; border:none; background:transparent; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:13px; color:var(--cafe);
  padding:8px; border-radius:8px; transition:background .18s, color .18s;
}
.opciones-sel button.activo{ background:var(--espresso); color:var(--miga); }

/* Tarjetas de plato */
.platos{ display:flex; flex-direction:column; gap:10px; }
.plato{
  background:var(--miga);
  border:1px solid var(--linea);
  border-radius:var(--radio);
  padding:15px 18px;
  box-shadow:var(--sombra);
  display:flex; align-items:baseline; gap:12px;
}
.plato::before{
  content:""; flex:0 0 auto;
  width:9px; height:9px; border-radius:50%;
  background:var(--miel);
  transform:translateY(5px);
}
.plato-cuerpo{ flex:1; }
.plato-nombre{
  font-family:"Amsi Pro Cond", sans-serif;
  font-weight:700; font-size:18px; line-height:1.2;
}
.plato-desc{
  font-size:14px; color:var(--cafe);
  margin-top:2px; line-height:1.35;
}

/* Panel de precios */
.precios{
  margin:10px 0 6px;
  background:var(--espresso);
  color:var(--miga);
  border-radius:var(--radio);
  padding:18px 18px 16px;
}
.precios-titulo{
  font-size:20px; font-weight:700; letter-spacing:.3px;
  color:var(--miel-sv); margin-bottom:14px;
}
.precio-fila{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:9px 0; border-bottom:1px solid rgba(251,246,236,.12);
}
.precio-fila:last-child{ border-bottom:none; }
.precio-label{ font-size:14px; font-weight:500; }
.precio-valor{ font-family:"Amsi Pro Cond", sans-serif; font-weight:700; font-size:20px; }
.precio-valor small{ font-size:12px; font-weight:600; opacity:.7; }

/* Bloques informativos */
.info-bloque{
  margin-top:14px; background:var(--miga); border:1px solid var(--linea);
  border-radius:var(--radio); padding:18px 18px 16px;
  box-shadow:var(--sombra);
}
.info-bloque h3{
  font-family:"Amsi Pro Cond", sans-serif;
  font-size:17px; font-weight:700; letter-spacing:0; text-transform:none;
  color:var(--espresso); margin-bottom:12px;
  display:flex; align-items:center; gap:9px;
}
.info-bloque h3::before{
  content:""; flex:0 0 auto;
  width:9px; height:9px; border-radius:50%; background:var(--miel);
}
.info-bloque p{ font-size:15px; color:var(--espresso); line-height:1.55; }
.info-bloque .adic{
  display:flex; justify-content:space-between; align-items:center;
  padding:9px 0; font-size:15px; font-weight:500;
  border-bottom:1px dashed var(--linea);
}
.info-bloque .adic:last-of-type{ border-bottom:none; }
.info-bloque .adic b{
  font-family:"Amsi Pro Cond", sans-serif; color:var(--miel); font-weight:700; font-size:16px;
}
.info-nota{ margin-top:8px; color:var(--cafe); font-size:13px; font-style:italic; }

/* Chips (cambios de proteína) */
.pills{ display:flex; flex-wrap:wrap; gap:8px; }
.pill{
  background:var(--miel-sv); color:var(--cafe);
  font-size:14px; font-weight:600;
  padding:7px 14px; border-radius:999px;
}

/* Pie */
.pie{
  text-align:center; padding:26px 16px 10px; color:var(--cafe); font-size:14px;
}
.pie .tels{ font-weight:700; color:var(--espresso); margin-top:8px; font-size:19px; line-height:1.5; }
.pie .tels a{ color:var(--espresso); text-decoration:none; }

/* ===================================================================
   BOTÓN FLOTANTE WHATSAPP
   =================================================================== */
.wa-flotante{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:20px; z-index:50;
  width:calc(100% - 32px); max-width:calc(var(--ancho) - 32px);
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--verde-wa); color:#fff;
  font-family:inherit; font-weight:700; font-size:16px;
  padding:15px 20px; border-radius:16px; text-decoration:none;
  box-shadow:0 6px 20px rgba(18,140,126,.35);
  transition:transform .12s ease, box-shadow .2s ease;
}
.wa-flotante:hover{ transform:translateX(-50%) translateY(-2px); }
.wa-flotante:active{ transform:translateX(-50%) translateY(0); }
.wa-flotante svg{ flex:0 0 auto; }

/* Accesibilidad y movimiento reducido */
:focus-visible{ outline:3px solid var(--miel); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
@keyframes entra{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.anima{ animation:entra .35s ease both; }

@media (min-width:600px){
  .marca{ font-size:30px; }
  .dia-nombre{ font-size:36px; }
}
</style>
</head>
<body>

<div class="contenedor">
  <header class="cabecera">
    <div class="marca-wrap">
      <!-- LOGO: guarda tu logo como "logo.png" junto a este archivo.
           Si no existe, se muestra el nombre en texto automáticamente. -->
      <img src="logo.png" alt="Golconda" class="logo-img" id="logoImg"
           onerror="this.style.display='none';document.getElementById('marcaTexto').style.display='block';" />
      <div class="marca" id="marcaTexto" style="display:none">Golconda</div>

  <span id="btnWaTexto">Pedir por WhatsApp</span>
</a>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ▼▼▼  ZONA EDITABLE — SOLO TOCA ESTO CADA SEMANA  ▼▼▼
   ═══════════════════════════════════════════════════════════════════ */

/* 1) PUNTOS DE VENTA ------------------------------------------------
   Cada punto tiene su nombre, dirección, teléfonos, WhatsApp y su
   propio archivo de menú (Excel). La página sabe cuál mostrar por el
   final del enlace: menu.html?p=santaana  o  menu.html?p=lisboa       */
const PUNTOS = {
  santaana: {
    nombre: "Santa Ana 109",
    direccion: "Cl. 109 # 6-55",
    telefonos: ["310 651 6929", "601 805 3232", "601 519 6661"],
    whatsapp: "573106516929",           // sin "+" ni espacios
    archivo: "menu-santaana.xlsx"
  },
  lisboa: {
    nombre: "Lisboa 134",
    direccion: "Cl. 134 # 9A-88",
    telefonos: ["601 615 1571", "601 805 1213"],   // CONFIRMAR con el punto
    whatsapp: "573106516929",           // CONFIRMAR si Lisboa tiene otro WhatsApp
    archivo: "menu-lisboa.xlsx"
  }
};
const PUNTO_DEFECTO = "santaana";

/* 2) DATOS COMPARTIDOS POR AMBOS PUNTOS (rara vez cambian) ----------- */
const CONFIG = {
  incluye: "Incluye jugo y postre",

  // Precios. "normal" = lunes a sábado. "domingoFestivo" = domingos y festivos.
  precios: {
    normal:         { puntoVenta: 27000, domicilio: 29900 },
    domingoFestivo: { puntoVenta: 32200, domicilio: 34500 }
  },

  // Tiquetera de 10 vales (lunes a sábado).
  tiquetera: { vales: 10, puntoVenta: 263000, domicilio: 292000, nota: "Pago únicamente en efectivo" },

  // Cambios de proteína disponibles todos los días.
  cambiosProteina: ["Carne de res", "Pollo", "Chuleta de cerdo"],

  // Adicionales con recargo.
  adicionales: [
    { nombre: "Trucha",  recargo: 5200 },
    { nombre: "Mojarra", recargo: 4100 }
  ]
};

/* 2) MENÚ DE RESPALDO (emergencia) ----------------------------------
   El menú de la semana se toma AUTOMÁTICAMENTE del archivo "menu.xlsx".
   Esto de abajo es solo un respaldo por si el Excel no se pudiera leer;
   así la página nunca queda en blanco. No hace falta editarlo cada semana. */

const MENU_FALLBACK = {
  lunes: {
    fecha: "13 jul", festivo: true,
    platos: [
      { nombre: "Sopa de cascabeles", desc: "Sopa casera con pasta cascabel" },
      { nombre: "Bistec a caballo", desc: "Res con huevo frito encima" },
      { nombre: "Bananitos al horno en salsa de naranja", desc: "Horneados en salsa de naranja" },
      { nombre: "Ensalada fría de garbanzo", desc: "Garbanzos con verduras frescas" },
      { nombre: "Arroz blanco", desc: "Recién hecho" }
    ]
  },
  martes: {
    fecha: "14 jul", festivo: false,
    platos: [
      { nombre: "Sopa de torrejas", desc: "Sopa con torrejas de la casa" },
      { nombre: "Pollo al horno", desc: "Jugoso y dorado al horno" },
      { nombre: "Papa salada", desc: "Papa cocida y sazonada" },
      { nombre: "Guacamole", desc: "Aguacate fresco machacado" },
      { nombre: "Arroz con verduras", desc: "Salteado con verduras" }
    ]
  },
  miercoles: {
    fecha: "15 jul", festivo: false,
    platos: [
      { nombre: "Sopa madrileña", desc: "Al estilo madrileño" },
      { nombre: "Steak pimienta", desc: "Res en salsa de pimienta" },
      { nombre: "Tortilla española", desc: "Con papa y huevo" },
      { nombre: "Ensalada romana", desc: "Lechuga romana fresca" },
      { nombre: "Arroz almendrado", desc: "Con almendras tostadas" }
    ]
  },
  jueves: {
    fecha: "16 jul", festivo: false,
    platos: [
      { nombre: "Crema de zucchini", desc: "Crema suave de calabacín" },
      { nombre: "Pollo meryland", desc: "Apanado estilo Maryland" },
      { nombre: "Papa hash brown", desc: "Dorada y crocante" },
      { nombre: "Ensalada florentina", desc: "Con espinaca fresca" },
      { nombre: "Arroz a las finas hierbas", desc: "Aromatizado con hierbas" }
    ]
  },
  viernes: {
    fecha: "17 jul", festivo: false,
    platos: [
      { nombre: "Sopa de cuchuco de cebada", desc: "Cuchuco tradicional de cebada" },
      { nombre: "Carne de res a la plancha", desc: "A la plancha, al gusto" },
      { nombre: "Plátano al horno con queso y bocadillo", desc: "Plátano, queso y bocadillo" },
      { nombre: "Verduras calientes", desc: "Salteadas del día" },
      { nombre: "Arroz blanco", desc: "Recién hecho" }
    ]
  },
  sabado: {
    fecha: "18 jul", festivo: false,
    // Día con DOS menús: se muestra un selector Opción 1 / Opción 2.
    opciones: [
      {
        nombre: "Opción 1",
        platos: [
          { nombre: "Ajiaco con pollo", desc: "Con crema de leche y alcaparras" },
          { nombre: "Aguacate", desc: "Fresco, en tajadas" },
          { nombre: "Mazorca", desc: "Mazorca tierna" },
          { nombre: "Arroz blanco", desc: "Recién hecho" }
        ]
      },
      {
        nombre: "Opción 2",
        platos: [
          { nombre: "Sopa de ajiaco", desc: "Ajiaco santafereño" },
          { nombre: "Carne de res / Pollo / Chuleta de cerdo", desc: "Elige tu proteína" },
          { nombre: "Yuca a la criolla", desc: "En salsa criolla" },
          { nombre: "Ensalada fantasía", desc: "Mezcla fresca de la casa" },
          { nombre: "Arroz blanco", desc: "Recién hecho" }
        ]
      }
    ]
  },
  domingo: {
    fecha: "19 jul", festivo: false,
    platos: [
      { nombre: "Sopa de verduras", desc: "Verduras frescas del día" },
      { nombre: "Filette stroganoff", desc: "Res en salsa stroganoff" },
      { nombre: "Soufflé de papa", desc: "Suave y horneado" },
      { nombre: "Ensalada de pepino cohombro a la vinagreta", desc: "Pepino a la vinagreta" },
      { nombre: "Arroz al cebollín", desc: "Con cebollín fresco" }
    ]
  }
};

// Menú "en vivo": empieza con el respaldo y se reemplaza con el Excel al cargar.
let MENU = MENU_FALLBACK;

/* ═══════════════════════════════════════════════════════════════════
   ▲▲▲  FIN DE LA ZONA EDITABLE  ▲▲▲
   De aquí para abajo es la lógica de la página. No necesitas tocarla.
   ═══════════════════════════════════════════════════════════════════ */

// Punto de venta activo, según el final del enlace (?p=santaana / ?p=lisboa)
const _params = new URLSearchParams(location.search);
let _clave = (_params.get("p") || "").toLowerCase().trim();
if(!PUNTOS[_clave]) _clave = PUNTO_DEFECTO;
const PUNTO = PUNTOS[_clave];
document.title = "Golconda · " + PUNTO.nombre + " · Menú del día";

const ORDEN = [
  { key:"lunes",     abrev:"Lun", label:"Lunes"     },
  { key:"martes",    abrev:"Mar", label:"Martes"    },
  { key:"miercoles", abrev:"Mié", label:"Miércoles" },
  { key:"jueves",    abrev:"Jue", label:"Jueves"    },
  { key:"viernes",   abrev:"Vie", label:"Viernes"   },
  { key:"sabado",    abrev:"Sáb", label:"Sábado"    },
  { key:"domingo",   abrev:"Dom", label:"Domingo"   }
];
// getDay(): 0=domingo, 1=lunes ... 6=sábado
const MAPA_JS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];

const pesos = n => "$" + n.toLocaleString("es-CO");

const hoyKey = MAPA_JS[new Date().getDay()];
let seleccionado = hoyKey;
let opcionActiva = 0;

/* ---- Pestañas ---- */
function pintarChips(){
  const track = document.getElementById("diasTrack");
  track.innerHTML = "";
  ORDEN.forEach(d => {
    const dato = MENU[d.key];
    const chip = document.createElement("button");
    chip.className = "chip"
      + (d.key === seleccionado ? " activo" : "")
      + (d.key === hoyKey ? " hoy" : "");
    chip.setAttribute("role","tab");
    chip.setAttribute("aria-selected", d.key === seleccionado);
    chip.innerHTML = `<span class="dia-abrev">${d.abrev}</span>
                      <span class="dia-fecha">${dato && dato.fecha ? dato.fecha : ""}</span>`;
    chip.addEventListener("click", () => {
      seleccionado = d.key;
      opcionActiva = 0;
      pintarChips();
      pintarPanel();
      chip.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
    });
    track.appendChild(chip);
  });
}

/* ---- Panel del día ---- */
function pintarPanel(){
  const info = ORDEN.find(d => d.key === seleccionado);
  const dia = MENU[seleccionado];
  const panel = document.getElementById("panel");

  if(!dia){
    panel.innerHTML = `<p style="padding:24px 0;color:var(--cafe)">No hay menú cargado para ${info.label}.</p>`;
    actualizarWhatsapp(info.label);
    return;
  }

  const esFestivo = seleccionado === "domingo" || dia.festivo === true;
  const tarifa = esFestivo ? CONFIG.precios.domingoFestivo : CONFIG.precios.normal;

  // Platos según haya opciones múltiples o una sola lista
  let selectorHTML = "";
  let platos;
  if(dia.opciones && dia.opciones.length){
    if(opcionActiva >= dia.opciones.length) opcionActiva = 0;
    platos = dia.opciones[opcionActiva].platos;
    selectorHTML = `<div class="opciones-sel" role="tablist">` +
      dia.opciones.map((o,i) =>
        `<button role="tab" aria-selected="${i===opcionActiva}" class="${i===opcionActiva?"activo":""}" data-op="${i}">${o.nombre}</button>`
      ).join("") + `</div>`;
  } else {
    platos = dia.platos || [];
  }

  const platosHTML = platos.map(p => `
    <div class="plato">
      <div class="plato-cuerpo">
        <div class="plato-nombre">${p.nombre}</div>
        ${p.desc ? `<div class="plato-desc">${p.desc}</div>` : ""}
      </div>
    </div>`).join("");

  const adicionalesHTML = CONFIG.adicionales.map(a =>
    `<div class="adic"><span>${a.nombre}</span><b>+ ${pesos(a.recargo)}</b></div>`
  ).join("");

  panel.innerHTML = `
    <div class="anima">
      <div class="dia-cabecera">
        <span class="dia-nombre">${info.label}</span>
        <span class="dia-fecha-grande">${dia.fecha || ""}</span>
        ${esFestivo ? `<span class="etiqueta-festivo">Festivo</span>` : ""}
      </div>

      ${selectorHTML}

      <div class="platos">${platosHTML}</div>

      <div class="incluye">✦ ${CONFIG.incluye}</div>

      <div class="precios">
        <div class="precios-titulo">Valor del Menú${esFestivo ? " · festivo" : ""}</div>
        <div class="precio-fila">
          <span class="precio-label">Punto de venta</span>
          <span class="precio-valor">${pesos(tarifa.puntoVenta)}</span>
        </div>
        <div class="precio-fila">
          <span class="precio-label">Domicilio</span>
          <span class="precio-valor">${pesos(tarifa.domicilio)}</span>
        </div>
      </div>

      <div class="info-bloque">
        <h3>Puedes cambiar la proteína por:</h3>
        <div class="pills">${CONFIG.cambiosProteina.map(c => `<span class="pill">${c}</span>`).join("")}</div>
      </div>

      <div class="info-bloque">
        <h3>Adicionales</h3>
        ${adicionalesHTML}
      </div>

      <div class="info-bloque">
        <h3>Tiquetera · ${CONFIG.tiquetera.vales} vales (lun a sáb)</h3>
        <div class="adic"><span>Punto de venta</span><b>${pesos(CONFIG.tiquetera.puntoVenta)}</b></div>
        <div class="adic"><span>Domicilio</span><b>${pesos(CONFIG.tiquetera.domicilio)}</b></div>
        <p class="info-nota">${CONFIG.tiquetera.nota}</p>
      </div>
    </div>`;

  // Activar el selector de opciones (si existe)
  panel.querySelectorAll(".opciones-sel button").forEach(btn => {
    btn.addEventListener("click", () => {
      opcionActiva = parseInt(btn.dataset.op, 10);
      pintarPanel();
    });
  });

  actualizarWhatsapp(info.label);
}

/* ---- Botón de WhatsApp ---- */
function actualizarWhatsapp(diaLabel){
  const msj = `¡Hola Golconda ${PUNTO.nombre}! 🍽️ Quisiera pedir el almuerzo de ${diaLabel} en el punto ${PUNTO.nombre}. ¿Me confirman disponibilidad?`;
  const url = `https://wa.me/${PUNTO.whatsapp}?text=${encodeURIComponent(msj)}`;
  document.getElementById("btnWhatsapp").setAttribute("href", url);
}

/* ---- Encabezado y pie según el punto ---- */
function pintarPunto(){
  document.getElementById("puntoNombre").textContent = PUNTO.nombre;
  document.getElementById("pieDireccion").textContent = PUNTO.nombre + " · " + PUNTO.direccion;
  document.getElementById("telefonos").innerHTML =
    PUNTO.telefonos.map(t => `<a href="tel:${t.replace(/\s/g,"")}">${t}</a>`).join(" · ");
}

/* ---- Lectura del menú desde menu.xlsx ---- */

// Texto normalizado: minúsculas y sin tildes (para comparar encabezados y días)
function norm(s){
  return (s==null?"":String(s)).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
const CLAVE_DIA = {
  lunes:"lunes", martes:"martes", miercoles:"miercoles", jueves:"jueves",
  viernes:"viernes", sabado:"sabado", domingo:"domingo"
};

async function cargarMenuDesdeExcel(){
  const url = PUNTO.archivo + "?v=" + Date.now();   // ?v=... evita que el navegador use una versión vieja
  const resp = await fetch(url);
  if(!resp.ok) throw new Error("no se pudo leer menu.xlsx (" + resp.status + ")");
  const buf = await resp.arrayBuffer();
  const wb = XLSX.read(buf, { type:"array" });

  const nombreHoja = wb.SheetNames.find(n => norm(n) === "menu") || wb.SheetNames[0];
  const ws = wb.Sheets[nombreHoja];
  const filas = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
  if(!filas.length) throw new Error("Excel vacío");

  const enc = filas[0].map(norm);
  const col = n => enc.indexOf(n);
  const cDia=col("dia"), cFecha=col("fecha"), cFest=col("festivo"),
        cOpc=col("opcion"), cPlato=col("plato"), cDesc=col("descripcion");
  if(cDia < 0 || cPlato < 0) throw new Error("faltan columnas Día/Plato");

  // Agrupar filas por día
  const acc = {};
  for(let i=1;i<filas.length;i++){
    const f = filas[i];
    const diaKey = CLAVE_DIA[norm(f[cDia])];
    const nombre = (f[cPlato] || "").toString().trim();
    if(!diaKey || !nombre) continue;
    if(!acc[diaKey]) acc[diaKey] = { fecha:"", festivo:false, filas:[] };
    const fecha = (cFecha>=0 ? (f[cFecha]||"") : "").toString().trim();
    if(fecha && !acc[diaKey].fecha) acc[diaKey].fecha = fecha;
    if(cFest>=0 && ["si","x","true","1"].includes(norm(f[cFest]))) acc[diaKey].festivo = true;
    acc[diaKey].filas.push({
      opcion: (cOpc>=0 ? (f[cOpc]||"") : "").toString().trim(),
      nombre: nombre,
      desc:   (cDesc>=0 ? (f[cDesc]||"") : "").toString().trim()
    });
  }

  // Convertir al formato que usa la página (menú único u opciones)
  const menu = {};
  for(const dia in acc){
    const d = acc[dia];
    const labels = [];
    d.filas.forEach(r => { if(r.opcion && !labels.includes(r.opcion)) labels.push(r.opcion); });
    if(labels.length >= 2){
      menu[dia] = { fecha:d.fecha, festivo:d.festivo,
        opciones: labels.map(lb => ({
          nombre: lb,
          platos: d.filas.filter(r => r.opcion===lb)
                         .map(r => ({ nombre:r.nombre, desc:r.desc||undefined }))
        }))
      };
    } else {
      menu[dia] = { fecha:d.fecha, festivo:d.festivo,
        platos: d.filas.map(r => ({ nombre:r.nombre, desc:r.desc||undefined })) };
    }
  }
  if(!Object.keys(menu).length) throw new Error("sin platos válidos");
  return menu;
}

/* ---- Arranque ---- */
function pintarTodo(){
  pintarChips();
  pintarPanel();
  const activo = document.querySelector(".chip.activo");
  if(activo && activo.scrollIntoView) activo.scrollIntoView({ inline:"center", block:"nearest" });
}

// Encabezado y pie del punto (una sola vez)
pintarPunto();

// 1) Pinta de inmediato con el menú de respaldo (la página nunca queda en blanco).
pintarTodo();

// 2) Luego intenta traer el menú real del Excel y vuelve a pintar.
(async function(){
  try{
    if(typeof XLSX === "undefined") return;      // sin librería -> se queda con el respaldo
    MENU = await cargarMenuDesdeExcel();
    pintarTodo();                                // re-pinta con los datos del Excel
  }catch(e){
    console.warn("Menú de respaldo en uso:", e.message);
  }
})();
</script>
